<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Compass Grid Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Circle / Badge Container -->
  <rect width="200" height="200" rx="40" fill="url(#bgGrad)"/>
  <rect width="192" height="192" x="4" y="4" rx="36" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Outer Shield Outer Line -->
  <path d="M 100 30 L 155 55 C 155 120 100 165 100 165 C 100 165 45 120 45 55 Z" 
        fill="url(#shieldGrad)" opacity="0.95" stroke="#60A5FA" stroke-width="3" filter="url(#glow)"/>

  <!-- Atlas / Latitude Longitude Mesh Grid -->
  <g opacity="0.4" stroke="#93C5FD" stroke-width="1.5" fill="none">
    <ellipse cx="100" cy="90" rx="35" ry="12"/>
    <ellipse cx="100" cy="90" rx="35" ry="25"/>
    <line x1="100" y1="40" x2="100" y2="145"/>
    <line x1="60" y1="90" x2="140" y2="90"/>
  </g>

  <!-- Center Compass / Security Core Icon -->
  <path d="M 100 70 L 108 86 L 124 90 L 108 94 L 100 110 L 92 94 L 76 90 L 92 86 Z" 
        fill="url(#accentGrad)" stroke="#34D399" stroke-width="2"/>
  
  <circle cx="100" cy="90" r="4" fill="#F0FDF4"/>

  <!-- Orbital Lock Node Rings -->
  <circle cx="100" cy="90" r="46" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,4" fill="none" opacity="0.7"/>

  <!-- Top Star Accent -->
  <polygon points="100,18 103,24 109,25 104,29 106,35 100,32 94,35 96,29 91,25 97,24" fill="#F59E0B"/>
</svg>
